spring.application.name=mandatodo-backend

# Conexión a MySQL (mandatodo_db)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mandatodo_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pPcCcC31015!}

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Servidor
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# Sesiones JWT (cambiar el secreto en producción mediante variable de entorno)
mandatodo.jwt.secret=${JWT_SECRET:mandatodo-dev-secret-change-me-2026-please-use-env}
mandatodo.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}

# Nominatim / OpenStreetMap (costo $0 USD)
mandatodo.geo.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
mandatodo.geo.user-agent=${NOMINATIM_USER_AGENT:MandaTodo/1.0 (soporte@mandatodo.local)}
mandatodo.geo.min-interval-ms=${NOMINATIM_MIN_INTERVAL_MS:1100}

# Orígenes permitidos para el frontend de desarrollo
mandatodo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
