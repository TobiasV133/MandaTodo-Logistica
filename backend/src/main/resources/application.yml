spring:
  application:
    name: mandatodo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mandatodo_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema se administra con schema.sql; Hibernate no lo crea ni lo modifica.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Argentina/Buenos_Aires

server:
  port: ${PORT:8080}

mandatodo:
  zona-horaria: America/Argentina/Buenos_Aires
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    # Se desactiva únicamente en pruebas automáticas.
    enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:mandatodo-dev-secret-change-me-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
  geo:
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
    user-agent: ${NOMINATIM_USER_AGENT:MandaTodo/1.0 (soporte@mandatodo.local)}
    min-interval-ms: ${NOMINATIM_MIN_INTERVAL_MS:1100}
  calendario:
    # Feriados en formato ISO (yyyy-MM-dd). Se usan además de sábados y domingos
    # para calcular el siguiente día hábil de una reprogramación.
    # Ejemplo: [2026-12-25, 2027-01-01]
    feriados: []
  remito:
    # Datos del emisor que se imprimen en el encabezado del remito.
    # Reemplazar por los datos reales de la empresa antes de usar los PDF fuera del prototipo.
    empresa:
      nombre: MandáTodo
      subtitulo: Logística y distribución
      direccion: Av. Corrientes 1234, CABA
      telefono: 11 4567-8901
      cuit: ""
